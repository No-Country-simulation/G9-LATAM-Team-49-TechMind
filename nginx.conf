# Nginx del contenedor frontend.
#
# Sirve el sitio estatico de Astro Y hace de proxy inverso hacia la API.
# Con esto todo el trafico entra por el puerto 80:
#
#   - No hay que abrir el 8000 en la Security List ni en el firewall de la VM.
#   - El navegador y la API comparten origen, asi que CORS deja de ser un
#     problema (el middleware sigue configurado por si se llama directo).
#   - Un unico punto de fallo que diagnosticar durante la demo.
#
# El upstream se resuelve mediante el DNS interno de Docker (127.0.0.11) con
# una variable, y no como nombre literal, para que nginx arranque aunque el
# contenedor `api` todavia no este listo o se haya reiniciado.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api;

    # --- Sitio estatico (Astro build) ---
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # --- API ---
    location /api/ {
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La primera inferencia carga spaCy + KeyBERT + BERTopic.
        proxy_connect_timeout  10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # --- Salud y documentacion interactiva ---
    location = /health {
        proxy_pass http://$api_upstream:8000/health;
        proxy_set_header Host $host;
    }

    location = /health/live {
        proxy_pass http://$api_upstream:8000/health/live;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://$api_upstream:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
