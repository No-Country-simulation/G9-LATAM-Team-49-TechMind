services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./chroma_db:/app/chroma_db
    environment:
      - PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:4321,http://147.224.239.129,http://147.224.239.129:80,http://147.224.239.129:8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - PUBLIC_API_URL=http://147.224.239.129:8000
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - api