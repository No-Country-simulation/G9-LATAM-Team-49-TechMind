services:
  api:
    build: ./backend
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models
      - ./chroma_db:/app/chroma_db
    environment:
      - PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:4321,http://147.224.239.129
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        PUBLIC_API_URL: ""
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - api
