name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src/ tests/ --select E9,F

      - name: Run tests
        env:
          PYTHONPATH: src
          PRECARGAR_MODELOS: '0'
        run: pytest tests/ -v

      - name: Build Docker image
        run: docker build -t techmind:ci .
