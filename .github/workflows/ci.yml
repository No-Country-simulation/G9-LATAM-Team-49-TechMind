name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements-dev.txt

      - name: Modelo de spaCy (lo usa el test de integracion)
        run: python -m spacy download es_core_news_sm

      - name: Lint
        run: ruff check backend/ tests/ scripts/entrenar.py scripts/verificar.py --select E9,F

      - name: Tests
        env:
          PYTHONPATH: backend
          PRECARGAR_MODELOS: '0'
        run: pytest tests/ -v

  imagenes:
    name: Build de imagenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build del backend
        run: docker build -t techmind-api:ci ./backend

      - name: Build del frontend
        run: docker build -t techmind-frontend:ci .

  frontend:
    name: Frontend (build de Astro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci || npm install
      - run: npm run build
