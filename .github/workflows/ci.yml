name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Tests y Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          python -m spacy download es_core_news_sm

      - name: Lint
        run: |
          ruff check backend tests scripts/entrenar.py scripts/verificar.py --select E9,F

      - name: Tests
        env:
          PYTHONPATH: backend
          PRECARGAR_MODELOS: "0"
        run: |
          python -m pytest tests/ -v

  frontend:
    name: Frontend - Astro
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build Astro
        run: npm run build

  docker:
    name: Docker - Backend y Frontend
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend
        run: docker build -t techmind-api:ci ./backend

      - name: Build frontend
        run: docker build -t techmind-frontend:ci .
